# NGP45HT：短按电源键不要做任何事。
#
# 2026-10-18 现象：误触一下电源键 → 立刻黑屏，再按无反应，SSH/ping 全无（设备自己挂在
# suspend 里）。RK3562 这类掌机的 s2idle/deep 在 BSP 内核上很不可靠，JELOS/ROCKNIX 正是
# 为此才用 rocknix-fake-suspend（只关屏 + 吞输入，不进内核 suspend）。
#
# 所以这里直接让 logind 忽略短按：
#   - 短按 = 什么都不做（不会再误触黑屏）
#   - 长按 8~10 秒仍由 RK805 PMIC 硬件强制断电，不受影响
#   - 想关机请走 ES 菜单 → 离开 → 关机
HandlePowerKey=ignore
